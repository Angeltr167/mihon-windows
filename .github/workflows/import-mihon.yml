name: Import Mihon upstream

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Import current Mihon main snapshot
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/mihonapp/mihon.git /tmp/mihon-source
          rsync -a --exclude='.git' --exclude='.github/workflows' /tmp/mihon-source/ ./
          git config user.name "Angeltr167"
          git config user.email "110307982+Angeltr167@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Mihon main baseline"
          git push origin HEAD:main
