name: UI Fidelity Validation

on:
  push:
    branches:
      - chatgpt/ui-fidelity-pass

concurrency:
  group: ui-fidelity-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Apply Spotless
        run: .\gradlew.bat spotlessApply
      - name: Spotless Check
        run: .\gradlew.bat spotlessCheck
      - name: Compile Desktop
        run: .\gradlew.bat :desktopApp:compileKotlinDesktop
      - name: Test Desktop
        run: .\gradlew.bat :desktopApp:desktopTest
      - name: Package Windows EXE
        run: .\gradlew.bat :desktopApp:packageExe
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktopApp/src/desktopMain/kotlin/mihon/desktop/DesktopShell.kt desktopApp/build.gradle.kts
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No formatting changes to commit."
            exit 0
          }
          git commit -m "style: apply manga details formatting [skip ci]"
          git push
